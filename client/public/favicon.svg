<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="pharmGlow" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#10B981"/>
            <stop offset="100%" stop-color="#047857"/>
        </linearGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#047857" flood-opacity="0.3"/>
        </filter>
    </defs>
    <!-- Fondo redondeado moderno -->
    <rect width="64" height="64" rx="16" fill="url(#pharmGlow)"/>
    <!-- Anillo sutil interior -->
    <rect x="2" y="2" width="60" height="60" rx="14" stroke="#A7F3D0" stroke-opacity="0.3" stroke-width="2"/>
    <!-- Cruz Farmacéutica estilizada -->
    <g filter="url(#dropShadow)" fill="#FFFFFF">
        <rect x="26" y="14" width="12" height="36" rx="5"/>
        <rect x="14" y="26" width="36" height="12" rx="5"/>
    </g>
    <!-- Píldora / Hoja de bienestar interior en verde esmeralda suave -->
    <circle cx="32" cy="32" r="3.5" fill="#059669"/>
</svg>

